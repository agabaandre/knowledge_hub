# Live-reload bind mounts for paths allowed in Docker Desktop File Sharing
# (e.g. under /Users). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  mysql:
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/99-khub.cnf:ro

  app:
    volumes:
      - ./:/var/www/html

  nginx:
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  scheduler:
    volumes:
      - ./:/var/www/html

  queue:
    volumes:
      - ./:/var/www/html
