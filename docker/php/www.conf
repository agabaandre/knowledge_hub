; PHP-FPM pool — Docker tier (~8 GB host equivalent, scaled down)
; Reference: https://github.com/agabaandre/PHP_laravel_Codeigniter_wordpress_server_optimisation_enterprise

[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 500
pm.process_idle_timeout = 10s

request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/www-slow.log

php_admin_value[error_log] = /var/log/php/error.log
php_admin_flag[log_errors] = on
