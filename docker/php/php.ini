; Knowledge Hub PHP — tuned for Docker (based on enterprise Laravel/PHP-FPM baseline)
; Reference: https://github.com/agabaandre/PHP_laravel_Codeigniter_wordpress_server_optimisation_enterprise

[PHP]
engine = On
short_open_tag = Off
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 10000
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 50

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/log/php/error.log

variables_order = "GPCS"
request_order = "GP"

expose_php = Off
allow_url_fopen = On
allow_url_include = Off
cgi.fix_pathinfo = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

default_socket_timeout = 300
zend.enable_gc = On
date.timezone = UTC

session.save_handler = files
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = Lax
session.gc_maxlifetime = 1440

mysqlnd.collect_memory_statistics = Off

; Keep exec available inside containers for Composer/Artisan maintenance
disable_functions = passthru,shell_exec,system,proc_open,popen

fastcgi.logging = 0
