# Knowledge Hub Next.js frontend — same idea as APM staff-portal under /staff/staff-portal/
#
# Production: Apache + PHP serve published files from public-spa/ (./setup-production.sh).
# Catch-all ProxyPass is intentionally omitted — it would hide those files and 502 when Node is down.
#
# Dev HMR: run `npm run dev` and use the websocket proxy below (enable proxy modules in httpd.conf):
#   Include /opt/homebrew/var/www/knowledge_hub/front_end/apache-front-end.conf

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300

<IfModule proxy_wstunnel_module>
    ProxyPass        /knowledge_hub/front_end/_next/webpack-hmr ws://127.0.0.1:3001/knowledge_hub/front_end/_next/webpack-hmr
    ProxyPassReverse /knowledge_hub/front_end/_next/webpack-hmr ws://127.0.0.1:3001/knowledge_hub/front_end/_next/webpack-hmr
</IfModule>

<Location /knowledge_hub/front_end>
    <IfModule mod_headers.c>
        Header always unset X-Content-Type-Options
        Header always unset X-Frame-Options
        Header always unset Content-Security-Policy
        Header always unset Referrer-Policy
        Header always unset Strict-Transport-Security
        Header always unset Permissions-Policy
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Content-Security-Policy "default-src 'none'"
        Header always set Referrer-Policy "no-referrer"
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    </IfModule>
</Location>

# Theme uses root-relative /assets/... (like a site at domain root). There is no
# /assets folder under DocumentRoot; map it to this app's public/assets.
Alias /assets "/opt/homebrew/var/www/knowledge_hub/front_end/public/assets"
<Directory "/opt/homebrew/var/www/knowledge_hub/front_end/public/assets">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
